name: Automated Code Quality Gatekeeper

on: [push, pull_request]

jobs:
  verify-code:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Industrial Code Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Static Code Analysis & Syntax Scan
        run: |
          echo "Scanning code for syntax errors and structural defects..."
          # Enforce compilation syntax guards
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          
      - name: Execute Automated Testing Suite
        run: |
          echo "Running unit test assertions..."
          python test_application.py
